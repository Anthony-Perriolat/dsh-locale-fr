name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke test the committed bundle
        run: node test/smoke.mjs
      - name: Rebuild and prove lib/ matches src/
        run: |
          node scripts/build.mjs
          if ! git diff --quiet -- lib; then
            echo "::error::lib/ is stale: run 'npm run build' and commit the result"
            git --no-pager diff --stat -- lib
            exit 1
          fi
